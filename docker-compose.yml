version: "3.9"

networks:
  # Réseau isolé à l'intérieur de l'avion
  net_aircraft_internal:
    driver: bridge
  # Le segment spatial (vulnérable, où l'attaquant peut agir)
  net_satcom_space:
    driver: bridge
  # Réseau isolé côté satellite / sol
  net_ground_internal:
    driver: bridge
  # Réseau de supervision et télémétrie
  net_management:
    driver: bridge

services:

  # ─── SEGMENT AVION ────────────────────────────────────────────────────────

  aircraft-app:
    container_name: aircraft-avionics
    build: ./aircraft-app
    networks:
      - net_aircraft_internal
    depends_on:
      - aircraft-sec-gw
    environment:
      - AIRCRAFT_GW_HOST=aircraft-sec-gw
      - AIRCRAFT_GW_PORT=9001

  aircraft-sec-gw:
    container_name: aircraft-pqc-gateway
    build: ./aircraft-sec-gw
    depends_on:
      - fpga-emulator
    networks:
      - net_aircraft_internal
      - net_satcom_space
      - net_management
    environment:
      - FPGA_API_URL=http://fpga-emulator:7000
      - LISTEN_UDP_PORT=9001
      - SAT_GW_HOST=satellite-sec-gw
      - SAT_GW_PORT=9002
      - TELEMETRY_URL=http://telemetry-bus:4222

  # ─── SEGMENT SPATIAL (SIMULATION) ─────────────────────────────────────────

  satcom-link-sim:
    container_name: satcom-emulator
    image: alpine
    networks:
      - net_satcom_space
    cap_add:
      - NET_ADMIN
    command: ["sh", "-c", "echo 'Simulateur de lien (tc/netem) prêt' && sleep infinity"]

  redteam-console:
    container_name: redteam-attacker
    build: ./redteam-console
    networks:
      - net_satcom_space
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TARGET_GW_HOST=satellite-sec-gw
      - TARGET_GW_PORT=9002
      - SPOOF_SRC_IP=10.10.10.100
    # Lancer manuellement : docker exec -it redteam-attacker python app.py --mode inject
    command: ["sleep", "infinity"]

  # ─── SEGMENT SATELLITE / SOL ──────────────────────────────────────────────

  satellite-sec-gw:
    container_name: satellite-pqc-gateway
    build: ./satellite-sec-gw
    depends_on:
      - fpga-emulator
    networks:
      - net_satcom_space
      - net_ground_internal
      - net_management
    environment:
      - FPGA_API_URL=http://fpga-emulator:7000
      - LISTEN_UDP_PORT=9002
      - SAT_APP_HOST=satellite-app
      - SAT_APP_PORT=9003

  satellite-app:
    container_name: ground-service
    build: ./satellite-app
    networks:
      - net_ground_internal
    environment:
      - LISTEN_UDP_PORT=9003

  # ─── SERVICES CRITIQUES ───────────────────────────────────────────────────

  fpga-emulator:
    container_name: pqc-fpga-core
    build: ./fpga-emulator
    networks:
      - net_management
    ports:
      - "7000:7000"

  blue-ai-langchain:
    container_name: ai-supervisor
    build: ./blue-ai-langchain
    networks:
      - net_management
    depends_on:
      - telemetry-bus

  telemetry-bus:
    container_name: event-broker
    image: nats:latest
    networks:
      - net_management

  grafana:
    image: grafana/grafana:latest
    networks:
      - net_management
    ports:
      - "3000:3000"
